plugins {
    id 'application'
}

group = 'audit.visualjava'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

application {
    mainClass = 'audit.dispatch.Main'
}
